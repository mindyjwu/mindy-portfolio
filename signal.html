<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time AI and innovation intelligence across 16 industries — 15+ stories daily, each with an estimated read time.">
  <meta property="og:title" content="SIGNAL — AI Innovation Feed · Mindy Wu">
  <meta property="og:description" content="Live AI and tech intelligence across Biotech, Hardware, Media, Finance, and 12 more industries.">
  <title>SIGNAL — AI Innovation Feed · Mindy Wu</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#eef2eb;--card:#fff;--sage:#6b8f71;--sd:#3a5c40;
      --sl:#d9e8d9;--sm:#a8c4a8;--br:#dce8db;--tx:#1c2b1e;--mu:#7a8c7b;
      --sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
      --sh2:0 6px 24px rgba(0,0,0,.11),0 1px 4px rgba(0,0,0,.06);
    }

    /* ── Site nav (matches your existing pages) ── */
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx)}
    .site-nav{background:#fff;border-bottom:1px solid var(--br);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:60}
    .site-nav-brand{font-size:15px;font-weight:700;color:var(--sd);text-decoration:none}
    .site-nav-links{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    .site-nav-links a{font-size:12.5px;font-weight:500;color:var(--mu);text-decoration:none;padding:5px 10px;border-radius:6px;transition:all .15s;white-space:nowrap}
    .site-nav-links a:hover{background:var(--sl);color:var(--sd)}
    .site-nav-links a.active{background:var(--sd);color:#fff}
    .site-nav-links a.cta{color:var(--sd);font-weight:600}

    /* ── SIGNAL header ── */
    .signal-header{background:#fff;border-bottom:1px solid var(--br);padding:20px 32px 14px}
    .sh-top{display:flex;align-items:center;gap:12px;margin-bottom:3px}
    .ldot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pls 2s infinite;flex-shrink:0}
    @keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(74,222,128,.5)}50%{box-shadow:0 0 0 6px rgba(74,222,128,0)}}
    .brand{font-size:26px;font-weight:900;letter-spacing:-1.5px;color:var(--sd)}
    .brand span{color:var(--sage)}
    .lvbg{font-size:9px;font-weight:800;letter-spacing:2px;color:var(--sage);border:1.5px solid var(--sage);padding:2px 7px;border-radius:4px}
    .lvbg.snap{color:#b45309;border-color:#b45309}
    .lvbg.daily{color:var(--sd);border-color:var(--sd)}
    .lvbg.sample{color:var(--mu);border-color:var(--br)}
    .ldot.off{animation:none;background:var(--sm)}
    .hsub{font-size:11.5px;color:var(--mu)}

    /* ── Stats bar ── */
    .sbar{background:var(--sd);padding:11px 32px;display:flex;align-items:center}
    .si{display:flex;flex-direction:column;padding-right:22px}
    .sn{font-size:20px;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1}
    .sl2{font-size:9px;color:var(--sm);text-transform:uppercase;letter-spacing:1.2px;margin-top:2px}
    .sdv{width:1px;height:24px;background:rgba(255,255,255,.15);margin-right:22px}

    /* ── Feed nav ── */
    .feed-nav{background:#fff;border-bottom:1px solid var(--br);padding:0 32px;display:flex;align-items:center;gap:2px}
    .ntab{padding:11px 14px;font-size:12.5px;font-weight:600;color:var(--mu);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;transition:all .15s;position:relative;top:1px}
    .ntab:hover{color:var(--sd)}.ntab.active{color:var(--sd);border-bottom-color:var(--sd)}
    .nsp{flex:1}
    .ddw{position:relative;padding:7px 0}
    .ddb{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;border:1.5px solid var(--br);background:transparent;color:var(--tx);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s}
    .ddb:hover,.ddb.open{border-color:var(--sage);background:var(--sl);color:var(--sd)}
    .ddc{font-size:9px;transition:transform .2s;display:inline-block}.ddb.open .ddc{transform:rotate(180deg)}
    .ddm{position:absolute;top:calc(100% + 3px);right:0;background:#fff;border:1px solid var(--br);border-radius:12px;padding:8px;box-shadow:0 8px 32px rgba(0,0,0,.12);z-index:300;display:grid;grid-template-columns:1fr 1fr;gap:3px;min-width:314px;opacity:0;pointer-events:none;transform:translateY(-6px);transition:all .18s}
    .ddm.open{opacity:1;pointer-events:all;transform:translateY(0)}
    .ddi{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:500;color:var(--tx);border:none;background:transparent;text-align:left;width:100%;transition:background .12s}
    .ddi:hover{background:var(--bg)}.ddi.sel{background:var(--sl);color:var(--sd);font-weight:700}
    .ddi-all{grid-column:1/-1;border-bottom:1px solid var(--br);padding-bottom:6px;margin-bottom:2px}
    .ddd{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* ── Status ── */
    .stbar{padding:7px 32px;font-size:11px;display:flex;align-items:center;gap:7px;transition:all .3s}
    .stbar.loading{background:#fffbeb;color:#92400e;border-bottom:1px solid #fde68a}
    .stbar.live{background:#f0fdf4;color:#15803d;border-bottom:1px solid #bbf7d0}
    .stbar.demo{background:#f8faff;color:#3b5a9a;border-bottom:1px solid #c7d8f7}
    .stbar.arch{background:#f5f3ff;color:#5b21b6;border-bottom:1px solid #ddd6fe}
    .stbar.snap{background:#fff7ed;color:#9a3412;border-bottom:1px solid #fed7aa}
    .stbar.daily{background:#f0f6f1;color:var(--sd);border-bottom:1px solid #cfe0d1}
    .stdt{width:6px;height:6px;border-radius:50%;flex-shrink:0}

    /* ── Grid & Cards ── */
    .ca{padding:20px 32px;max-width:1400px;margin:0 auto}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:14px}
    .slbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--mu);margin-bottom:14px}
    .dhdr{font-size:11px;font-weight:700;color:var(--mu);margin:20px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--br)}
    .card{background:var(--card);border-radius:12px;box-shadow:var(--sh);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--br);transition:box-shadow .2s,transform .2s}
    .card:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
    .ct{height:140px;position:relative;overflow:hidden}
    .ct-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s}
    .ct-img.ok{opacity:1}
    .ct-ov{position:absolute;inset:0}
    .ct-cnt{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:13px 18px}
    .stbig{font-size:44px;font-weight:900;letter-spacing:-3px;line-height:1;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}
    .stlbl{font-size:10px;color:rgba(255,255,255,.75);font-weight:500;margin-top:1px}
    .cb{padding:14px 18px;flex:1;display:flex;flex-direction:column;gap:8px}
    .chip{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:3px 8px;border-radius:4px;width:fit-content}
    .chl{font-size:14px;font-weight:700;line-height:1.42;color:var(--tx);letter-spacing:-.2px}
    .csu{font-size:11.5px;color:var(--mu);line-height:1.65}
    .cft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px solid var(--br)}
    .cmeta{display:flex;flex-direction:column;gap:2px}
    .cco{font-size:10px;color:var(--mu);font-weight:600}
    .csrc{font-size:9.5px;color:var(--sage);font-weight:600;text-decoration:none}
    .csrc:hover{color:var(--sd);text-decoration:underline}
    .arr{font-size:11px;color:var(--mu);background:var(--bg);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--br);flex-shrink:0;transition:all .15s}
    .card:hover .arr{background:var(--sd);color:#fff;border-color:var(--sd)}
    .tag{font-size:9px;color:var(--mu);border:1px solid var(--br);padding:2px 6px;border-radius:4px;font-weight:500;background:var(--bg)}

    /* ── Modal ── */
    .mo{position:fixed;inset:0;background:rgba(20,35,20,.5);backdrop-filter:blur(10px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
    .mo.open{opacity:1;pointer-events:all}
    .mdl{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:660px;max-height:86vh;overflow-y:auto;transform:translateY(30px);transition:transform .32s cubic-bezier(.32,.72,0,1);scrollbar-width:thin}
    .mo.open .mdl{transform:translateY(0)}
    .mhdr{height:190px;position:relative;border-radius:20px 20px 0 0;overflow:hidden;display:flex;align-items:flex-end;padding:20px 26px}
    .mhbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
    .mhbg.ok{opacity:1}.mhov{position:absolute;inset:0}
    .mhcnt{position:relative;z-index:2}
    .mhnum{font-size:58px;font-weight:900;letter-spacing:-4px;line-height:1;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.4)}
    .mhlbl{font-size:12px;color:rgba(255,255,255,.65);margin-top:1px}
    .mcls{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .18s}
    .mcls:hover{background:rgba(0,0,0,.5)}
    .mbdy{padding:22px 26px}
    .mir{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
    .msrc{font-size:10px;color:var(--sage);text-decoration:none;font-weight:600}
    .msrc:hover{text-decoration:underline;color:var(--sd)}
    .mhl{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.3;color:var(--tx);margin-bottom:16px}
    .mmet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
    .mmc{background:var(--bg);border:1px solid var(--br);border-radius:10px;padding:13px;text-align:center}
    .mmv{font-size:18px;font-weight:900;letter-spacing:-.5px;line-height:1}
    .mml{font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
    .mdet{font-size:13px;line-height:1.82;color:#4a5e4b;margin-bottom:16px}
    .mtgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .mft{font-size:10px;color:var(--mu);padding-top:12px;border-top:1px solid var(--br);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .mft a{color:var(--sage);text-decoration:none;font-weight:600}.mft a:hover{text-decoration:underline}

    /* ── Site footer ── */
    .site-footer{text-align:center;padding:32px;font-size:12px;color:var(--mu);border-top:1px solid var(--br);margin-top:40px;background:#fff}
    .site-footer a{color:var(--sage);text-decoration:none}.site-footer a:hover{text-decoration:underline}

    /* ── Empty / error ── */
    .empty{text-align:center;padding:60px 32px;color:var(--mu)}
    .empty h2{color:var(--tx);margin-bottom:8px}
    .aempty{text-align:center;padding:50px;color:var(--mu);font-size:13px;line-height:1.8}

    /* ── Read time badge ── */
    .cmeta2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}
    .rt{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;color:var(--mu);background:var(--bg);border:1px solid var(--br);padding:2px 7px;border-radius:20px;white-space:nowrap}
    /* ── Podcast script export ── */
    .dlb{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;border:1.5px solid var(--br);background:transparent;color:var(--mu);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s;margin-right:7px;font-family:inherit}
    .dlb:hover{border-color:var(--sage);background:var(--sl);color:var(--sd)}

    /* ── On-demand industry fetch ── */
    .fetchrow{display:flex;justify-content:center;padding:24px 0 6px}
    .fetchmore{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;border:1.5px dashed var(--sm);background:#fff;color:var(--sd);font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
    .fetchmore:hover{border-style:solid;border-color:var(--sage);background:var(--sl)}
    .fetchmore:disabled{opacity:.55;cursor:progress}
    .spin{width:12px;height:12px;border:2px solid var(--sm);border-top-color:var(--sd);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;flex-shrink:0}
    @keyframes sp{to{transform:rotate(360deg)}}
    .sbar{overflow-x:auto;scrollbar-width:none}
    .sbar::-webkit-scrollbar{display:none}

    @media(max-width:600px){
      .site-nav,.signal-header,.sbar,.feed-nav,.ca,.stbar{padding-left:16px;padding-right:16px}
      .mmet{grid-template-columns:repeat(2,1fr)}.mbdy{padding:16px}
      .grid{grid-template-columns:1fr}.ddm{min-width:260px;grid-template-columns:1fr}
      .dlb{margin-right:5px;padding:5px 9px;font-size:11px}
    }
  </style>
</head>

<script>
const META={
  biotech:      {label:'Biotech & Health',         color:'#0891b2',bg:'linear-gradient(135deg,#0369a1,#0891b2)'},
  media:        {label:'Media & Creative',          color:'#7c3aed',bg:'linear-gradient(135deg,#5b21b6,#7c3aed)'},
  legal:        {label:'Legal Tech',                color:'#d97706',bg:'linear-gradient(135deg,#b45309,#d97706)'},
  hardware:     {label:'Hardware & Chips',          color:'#ea580c',bg:'linear-gradient(135deg,#c2410c,#ea580c)'},
  software:     {label:'Software & AI',             color:'#2563eb',bg:'linear-gradient(135deg,#1d4ed8,#2563eb)'},
  agriculture:  {label:'Agriculture & FoodTech',   color:'#16a34a',bg:'linear-gradient(135deg,#15803d,#16a34a)'},
  finance:      {label:'Finance & Fintech',         color:'#059669',bg:'linear-gradient(135deg,#047857,#059669)'},
  energy:       {label:'Energy & Climate',          color:'#dc2626',bg:'linear-gradient(135deg,#b91c1c,#dc2626)'},
  manufacturing:{label:'Manufacturing & Robotics',  color:'#6d28d9',bg:'linear-gradient(135deg,#4c1d95,#6d28d9)'},
  education:    {label:'Education & Research',      color:'#db2777',bg:'linear-gradient(135deg,#be185d,#db2777)'},

const TODAY=new Date().toISOString().split('T')[0];
const IND_COUNT=Object.keys(META).length;
let todayStories=[],archiveDays=[],curView='today',selIndustry=null;
// mode: 'live' (today's sweep) | 'snapshot' (the committed last-good sweep) | 'sample' (hardcoded placeholder)
let mode='sample',SNAP=null,sweepsDone=0,fetchingInd=null;

function imgUrl(s){const pid=PHOTO[s.industry]||PHOTO.others;return`https://images.unsplash.com/photo-${pid}?w=800&h=300&fit=crop&auto=format&q=75`;}
function fbUrl(s){const seed=((s.company||'')+(s.industry||'')).replace(/\W/g,'').toLowerCase().slice(0,18)||'tech';return`https://picsum.photos/seed/${seed}/800/300`;}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// localStorage cache
// Three sweeps a day store roughly 3x what the old 5-story fetch did, so the
// archive is capped — otherwise saves start failing silently on quota.
const ARCHIVE_DAYS=14;
function sigKeys(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf('sig:')===0)keys.push(k);
  }
  return keys.sort().reverse();  // ISO dates sort lexically; newest first
}
function pruneArchive(){
  try{sigKeys().slice(ARCHIVE_DAYS).forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});}catch(e){}
}
function saveDay(st){
  const payload=JSON.stringify(st);
  try{localStorage.setItem('sig:'+TODAY,payload);pruneArchive();}
  catch(e){
    // Out of room: drop the oldest days and try once more.
    pruneArchive();
    try{localStorage.setItem('sig:'+TODAY,payload);}
    catch(e2){console.warn('[signal] could not cache today\'s stories',e2);}
  }
}
function loadDay(){try{const r=localStorage.getItem('sig:'+TODAY);return r?JSON.parse(r):null;}catch(e){return null;}}
function loadArchive(){
  try{
    const days=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf('sig:')===0&&k!=='sig:'+TODAY){
        try{const v=localStorage.getItem(k);if(v)days.push({date:k.replace('sig:',''),stories:JSON.parse(v)});}catch(e){}
      }
    }
    return days.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,ARCHIVE_DAYS);
  }catch(e){return[];}
}

/* ═══ Read time ═══════════════════════════════════════════
   readMinutes is the source article's length, estimated by the model.
   If it's missing we fall back to scaling up our own summary text. */
function wordCount(t){return String(t||'').trim().split(/\s+/).filter(Boolean).length;}
function readMin(s){
  const n=Number(s.readMinutes);
  if(Number.isFinite(n)&&n>0)return Math.max(1,Math.min(20,Math.round(n)));
  return Math.max(2,Math.min(20,Math.round(wordCount((s.summary||'')+' '+(s.detail||''))*4/230)));
}
function readTotal(list){return Math.max(1,list.reduce((a,s)=>a+readMin(s),0));}
// Rough spoken length if the script below were recorded, at ~165 words per minute.
function spokenMins(list){
  const w=list.reduce((a,s)=>a+wordCount(scriptFor(s)),0);
  return Math.max(1,Math.round(w/165));
}
function coveredCount(){return new Set(todayStories.map(s=>s.industry)).size;}

/* ═══ Data mode ═══════════════════════════════════════════
   The badge, the pulsing dot, and every date label derive from `mode`, so the
   page can never say LIVE over stories that aren't. */
function fmtDay(iso){return new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
function feedDate(){return mode==='snapshot'&&SNAP?new Date(SNAP.date+'T12:00:00'):new Date();}
// A daily snapshot is healthy for two days, which tolerates one missed run.
// Past that, the page says so instead of letting old news pass as current.
function snapAge(){return Math.max(0,Math.round((Date.parse(TODAY+'T00:00:00Z')-Date.parse(SNAP.date+'T00:00:00Z'))/864e5));}
function snapDaily(){return !!(SNAP&&SNAP.refresh==='daily');}
function snapStale(){return snapDaily()&&snapAge()>2;}
function snapHealthy(){return snapDaily()&&!snapStale();}
function dateLabel(){
  if(mode==='snapshot'&&SNAP)return snapDaily()&&snapAge()===0?'Today — '+fmtDay(SNAP.date):'Sweep from '+fmtDay(SNAP.date);
  if(mode==='sample')return 'Sample stories';
  return 'Today — '+fmtDay(TODAY);
}
function setMode(m){
  mode=m;
  const b=document.getElementById('lvbg'),d=document.getElementById('ldot');
  b.className='lvbg'+(m==='live'?'':m==='snapshot'?(snapHealthy()?' daily':' snap'):' sample');
  b.textContent=m==='live'?'LIVE':m==='snapshot'?(snapDaily()?(snapStale()?'STALE':'DAILY'):'SNAPSHOT'):'SAMPLE';
  d.classList.toggle('off',m!=='live');
}
function snapStatus(){
  if(snapDaily()){
    const age=snapAge();
    return age>2
      ? 'Daily refresh has stopped · latest sweep '+fmtDay(SNAP.date)+' ('+age+' days old)'
      : 'Updated daily · latest sweep '+fmtDay(SNAP.date);
  }
  return SNAP.frozen
    ? 'Frozen snapshot · sweep from '+fmtDay(SNAP.date)+' · live refresh off'
    : 'Live refresh unavailable · showing the '+fmtDay(SNAP.date)+' sweep';
}
function snapBar(){setSt(snapHealthy()?'daily':'snap',snapHealthy()?'#3a5c40':'#b45309',snapStatus());}

/* ═══ Story helpers ═══════════════════════════════════════ */
function keyOf(s){return (s.url||'')+'|'+String(s.headline||'').toLowerCase().replace(/\W+/g,'');}
function mergeStories(incoming){
  const seen=new Set(todayStories.map(keyOf));
  const added=[];
  (incoming||[]).forEach(s=>{
    const k=keyOf(s);
    if(!seen.has(k)&&s.headline){seen.add(k);todayStories.push(s);added.push(s);}
  });
  return added;
}
function visibleStories(){
  if(curView==='today')return selIndustry?todayStories.filter(s=>s.industry===selIndustry):todayStories;
  const out=[];
  archiveDays.forEach(d=>{
    (selIndustry?d.stories.filter(s=>s.industry===selIndustry):d.stories).forEach(s=>out.push(s));
  });
  return out;
}
function listify(a){
  if(a.length<=1)return a[0]||'';
  if(a.length===2)return a[0]+' and '+a[1];
  return a.slice(0,-1).join(', ')+', and '+a[a.length-1];
}

/* ═══ Audio: script writing ═══════════════════════════════ */
function scriptFor(s,i,total){
  const m=META[s.industry]||META.others;
  const p=[];
  if(typeof i==='number')p.push(`Story ${i+1}${total?' of '+total:''}. ${m.label}.`);
  p.push(String(s.headline||'').replace(/\.$/,'')+'.');
  if(s.company)p.push(`From ${s.company}${s.source?', reported by '+s.source:''}.`);
  if(s.summary)p.push(s.summary);
  if(s.stat&&s.statLabel)p.push(`The number to hold onto: ${s.stat} ${s.statLabel}.`);
  if(s.detail)p.push(s.detail);
  return p.filter(Boolean).join(' ');
}
function introText(list){
  const d=feedDate().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const inds=[...new Set(list.map(s=>(META[s.industry]||META.others).label))];
  return `This is Signal, your A.I. and innovation briefing for ${d}. ${list.length} `+
    `${list.length===1?'story':'stories'} today across ${inds.length} `+
    `${inds.length===1?'industry':'industries'}: ${listify(inds)}. Here is what happened.`;
}
function outroText(list){
  const mins=Math.max(1,Math.round(list.reduce((a,s)=>a+readMin(s),0)));
  return `That is your Signal briefing. ${list.length} ${list.length===1?'story':'stories'}, `+
    `about ${mins} minutes of reading if you open every source. Every link is on the page. See you tomorrow.`;
}
function fullScript(list){
  const d=feedDate().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const out=[`SIGNAL — ${d}`,`${list.length} stories · ~${spokenMins(list)} min read aloud · ${readTotal(list)} min to read every source`,'',
    'COLD OPEN','',introText(list),''];
  list.forEach((s,i)=>{
    const m=META[s.industry]||META.others;
    out.push(`─── ${i+1}. ${m.label.toUpperCase()} ───`,'',scriptFor(s,i,list.length),'');
    if(s.url)out.push(`Source: ${s.source||'link'} — ${s.url} (${readMin(s)} min read)`,'');
  });
  out.push('SIGN OFF','',outroText(list),'');
  return out.join('\n');
}

function downloadScript(){
  const list=visibleStories();
  if(!list.length)return;
  const blob=new Blob([fullScript(list)],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='signal-podcast-'+TODAY+'.txt';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function rGrid(stories,container){
  const g=document.createElement('div');g.className='grid';
  stories.forEach(s=>g.appendChild(makeCard(s)));
  container.appendChild(g);
}

function fetchRow(id,haveSome){
  if(SNAP&&SNAP.frozen)return null;
  const m=META[id];if(!m)return null;
  const wrap=document.createElement('div');wrap.className='fetchrow';
  const b=document.createElement('button');b.className='fetchmore';
  const busy=fetchingInd===id;
  b.disabled=!!fetchingInd;
  b.innerHTML=busy
    ? `<span class="spin"></span> Searching ${m.label} news…`
    : `<span class="ddd" style="background:${m.color}"></span> ${haveSome?'Find more':'Search'} ${m.label} stories →`;
  b.onclick=()=>fetchIndustry(id);
  wrap.appendChild(b);
  return wrap;
}

function showToday(){
  const c=document.getElementById('content');c.innerHTML='';
  const fs=visibleStories();
  const lbl=document.createElement('div');lbl.className='slbl';
  if(fs.length){
    lbl.textContent=selIndustry
      ? `${dateLabel()} · ${META[selIndustry].label} · ${fs.length} ${fs.length===1?'story':'stories'} · ${readTotal(fs)} min of reading`
      : `${dateLabel()} · ${fs.length} stories · ${readTotal(fs)} min of reading`;
    c.appendChild(lbl);rGrid(fs,c);
  }else{
    c.innerHTML=`<div class="empty"><h2>${selIndustry?'Nothing in this category yet today':'No stories yet'}</h2>
      <p style="font-size:13px;margin-top:6px">${selIndustry?'Signal can go looking for it right now.':''}</p></div>`;
  }
  if(selIndustry){const r=fetchRow(selIndustry,fs.length>0);if(r)c.appendChild(r);}
}

function showArchive(){
  const c=document.getElementById('content');c.innerHTML='';
  if(!archiveDays.length){c.innerHTML='<div class="aempty">Archive is empty — past stories are saved automatically each day.</div>';return;}
  let any=false;
  archiveDays.forEach(day=>{
    const fs=selIndustry?day.stories.filter(s=>s.industry===selIndustry):day.stories;
    if(!fs.length)return;any=true;
    const dh=document.createElement('div');dh.className='dhdr';
    dh.textContent=new Date(day.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})
      +` · ${fs.length} ${fs.length===1?'story':'stories'}`;
    c.appendChild(dh);rGrid(fs,c);
  });
  if(!any)c.innerHTML='<div class="aempty">No archived stories match this filter.</div>';
}

  curView==='today'?showToday():showArchive();

const DEMO_META={"hottest": "software", "totalFunding": "$1.3B"};

/* ═══ Fetching ════════════════════════════════════════════ */
function applyMeta(meta){
  if(!meta)return;
  const hm=META[meta.hottest];
  if(hm)document.getElementById('s-hot').textContent=hm.label.split(' ')[0];
  else if(meta.hottest)document.getElementById('s-hot').textContent=meta.hottest;
  if(meta.totalFunding)document.getElementById('s-fund').textContent=meta.totalFunding;
}

async function getJSON(url){
  const res=await fetch(url);
  if(!res.ok)throw new Error('HTTP '+res.status);
  const d=await res.json();
  if(d.error)throw new Error(d.error);
  return d;
}

function absorb(stories,meta){
  if(!stories||!stories.length)return 0;
  if(mode!=='live'){setMode('live');todayStories=[];}
  const added=mergeStories(stories);
  applyMeta(meta);
  saveDay(todayStories);
  updStats();
  renderView();
  return added.length;
}

// Three parallel sweeps, five industries each — far more coverage than one
// request can find inside a single function timeout.
async function fetchAll(){
  const hasSnap=!!(SNAP&&SNAP.stories.length);
  setSt('loading','#d97706',hasSnap
    ?`Showing the ${fmtDay(SNAP.date)} sweep while today\'s loads (up to 2 min)…`
    :'Sweeping 16 industries for today\'s stories (up to 2 min on the first load of the day)…');
  sweepsDone=0;
  await Promise.all([1,2,3].map(async n=>{
    try{
      const d=await getJSON('/api/signal?batch='+n);
      absorb(d.stories,d.meta);
    }catch(e){console.warn('[signal] sweep '+n,e);}
    sweepsDone++;
    if(sweepsDone<3&&mode==='live')setSt('loading','#d97706',`${todayStories.length} stories in · sweep ${sweepsDone} of 3 done…`);
  }));
  if(mode==='live')setSt('live','#15803d',`✓ ${todayStories.length} live stories · ${coveredCount()} of ${IND_COUNT} industries · ${TODAY}`);
  else if(hasSnap)snapBar();
  else setSt('demo','#3b82f6','Showing sample stories · live data unavailable');
  updStats();renderView();
}

async function fetchIndustry(id){
  if(fetchingInd)return;
  fetchingInd=id;renderView();
  setSt('loading','#d97706',`Searching ${META[id].label} for fresh stories…`);
  try{
    const d=await getJSON('/api/signal?industry='+encodeURIComponent(id));
    const n=absorb(d.stories,null);
    fetchedInd.add(id);
    setSt(n?'live':'demo',n?'#15803d':'#3b82f6',
      n?`✓ Added ${n} ${META[id].label} ${n===1?'story':'stories'} · ${todayStories.length} total`
       :`No new ${META[id].label} stories found — try again later.`);
  }catch(e){
    console.warn('[signal] industry '+id,e);
    setSt('demo','#3b82f6',`Couldn't reach the ${META[id].label} feed — try again in a moment.`);
  }
  fetchingInd=null;renderView();
}

/* ═══ Boot ════════════════════════════════════════════════ */
function wireControls(){
  document.getElementById('dlb').onclick=downloadScript;
}

/* The snapshot is a real sweep committed to the repo at data/signal-snapshot.json.
   Refresh it with `node scripts/snapshot-signal.mjs capture`; flip `frozen` to
   demo it with zero API calls. */
async function loadSnapshot(){
  try{
    const r=await fetch('/data/signal-snapshot.json',{cache:'no-cache'});
    if(!r.ok)return null;
    const j=await r.json();
    return (j&&Array.isArray(j.stories)&&typeof j.date==='string')?j:null;
  }catch(e){return null;}
}
function useSnapshot(){
  setMode('snapshot');
  todayStories=SNAP.stories.slice();
  applyMeta(SNAP.meta);
  updStats();renderView();
}
function useSample(){
  setMode('sample');
  todayStories=DEMO.slice();
  updStats();applyMeta(DEMO_META);
  renderView();
}

async function init(){
  buildDD();wireControls();
  archiveDays=loadArchive();
  SNAP=await loadSnapshot();
  const hasSnap=!!(SNAP&&SNAP.stories.length);

  // Frozen: render the committed sweep and never touch the API.
  // Zero credits, zero cold start — this is the demo switch.
  if(hasSnap&&SNAP.frozen){
    useSnapshot();
    snapBar();
    return;
  }
  const stored=loadDay();
  if(stored&&stored.length){
    setMode('live');todayStories=stored;
    updStats();
    setSt('live','#15803d',`✓ Today's ${stored.length} stories · ${coveredCount()} industries · ${TODAY}`);
    renderView();return;
  }
  // Real last-good data as the placeholder while the sweeps run — not fiction.
  if(hasSnap)useSnapshot();else useSample();
  fetchAll();
}
init();
</script>
