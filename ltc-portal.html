<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<!--#artifact-begin-->
<title>康禾長照營運入口 Kanghe Ops Portal</title>
<style>
:root{
  --ground:#F5F7F6; --surface:#FFFFFF; --surface-2:#EEF2F0; --rail:#12211D;
  --rail-ink:#CFDCD7; --rail-ink-dim:#8AA09A; --line:#DCE3E0; --line-strong:#C3CFCB;
  --ink:#16211E; --ink-2:#43534E; --ink-3:#6B7C77;
  --accent:#1F6F5C; --accent-ink:#FFFFFF; --accent-soft:#DCEAE4; --accent-line:#A9CDC1;
  --ok:#2E7D4F; --ok-soft:#DFF0E5; --warn:#9A6410; --warn-soft:#FBEFD8; --warn-line:#E4C489;
  --crit:#A93A46; --crit-soft:#F8E3E5; --info:#2F5F7D; --info-soft:#E1ECF3;
  --shadow:0 1px 2px rgba(22,33,30,.06), 0 8px 24px -16px rgba(22,33,30,.35);
  --radius:8px;
  --sans:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1513; --surface:#151E1B; --surface-2:#1B2724; --rail:#0A100E;
    --rail-ink:#D3E0DB; --rail-ink-dim:#7A908A; --line:#28352F; --line-strong:#3A4A44;
    --ink:#E7EEEA; --ink-2:#B3C2BC; --ink-3:#869892;
    --accent:#57B99B; --accent-ink:#08201A; --accent-soft:#1C332C; --accent-line:#2F5A4C;
    --ok:#6FC98D; --ok-soft:#17301F; --warn:#E0B061; --warn-soft:#33280F; --warn-line:#5C481D;
    --crit:#E8909A; --crit-soft:#361B1F; --info:#8FBCD8; --info-soft:#14252F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1513; --surface:#151E1B; --surface-2:#1B2724; --rail:#0A100E;
  --rail-ink:#D3E0DB; --rail-ink-dim:#7A908A; --line:#28352F; --line-strong:#3A4A44;
  --ink:#E7EEEA; --ink-2:#B3C2BC; --ink-3:#869892;
  --accent:#57B99B; --accent-ink:#08201A; --accent-soft:#1C332C; --accent-line:#2F5A4C;
  --ok:#6FC98D; --ok-soft:#17301F; --warn:#E0B061; --warn-soft:#33280F; --warn-line:#5C481D;
  --crit:#E8909A; --crit-soft:#361B1F; --info:#8FBCD8; --info-soft:#14252F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.brand b{color:#fff;font-size:15px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--rail-ink-dim);letter-spacing:.04em}
.rail-group{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-ink-dim)}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--rail-ink);cursor:pointer;font-size:13.5px;white-space:nowrap}
.navitem:hover{background:rgba(255,255,255,.06)}
.navitem[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.navitem[disabled]{opacity:.42;cursor:not-allowed}
.navitem .en{font-size:10.5px;color:inherit;opacity:.6;margin-left:auto;font-family:var(--mono);flex:none}
.navdot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:var(--rail-ink-dim);line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.utility{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ufield{display:flex;align-items:center;gap:6px}
.ulabel{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
select,input[type=search],input[type=text]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px}
select[disabled]{background:var(--surface-2);color:var(--ink-3);cursor:not-allowed}
.spacer{flex:1 1 auto}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg button+button{border-left:1px solid var(--line-strong)}

/* assumption toggle */
.assume{display:flex;align-items:center;gap:8px;border:1px dashed var(--warn-line);background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:4px 9px;cursor:pointer}
.assume b{font-weight:600;font-size:12px}
.assume small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.switch{width:30px;height:17px;border-radius:99px;background:var(--line-strong);position:relative;flex:none;transition:background .16s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.assume[aria-pressed="true"] .switch{background:var(--warn)}
.assume[aria-pressed="true"] .switch::after{transform:translateX(13px)}

.content{padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%}
.content-solo{padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px;max-width:900px;width:100%}
.pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead h1{font-size:20px}
.pagehead .sub{color:var(--ink-3);font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:2px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--ink-2);font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tabs .ten{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:5px}

/* ---------- scope banner ---------- */
.scopebar{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius);border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:12.5px}
.scopebar.is-open{border-left-color:var(--warn);background:var(--warn-soft)}
.scopebar b{font-weight:600}
.scopebar .q{font-size:11.5px;color:var(--ink-2);display:block;margin-top:3px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:14px}
.card-h .en{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.card-b{padding:14px}
.grid{display:grid;gap:14px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:11px;color:var(--ink-3)}
.tile .v{font-size:22px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .d{font-size:11px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 7px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);font-style:normal}
.lock svg{width:11px;height:11px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:1px solid transparent;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-strong);font-weight:400}
.btn.mini{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-2)}
tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:13px}
.bi{display:flex;flex-direction:column;line-height:1.25}
.bi .en{font-size:11px;color:var(--ink-3)}
</style>
<style>
/* ---------- announcements ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.annlist{display:flex;flex-direction:column}
.annrow{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:3px solid transparent;text-align:left;width:100%;border-top:0;border-right:0}
.annrow:hover{background:var(--surface-2)}
.annrow[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.annrow .t{font-weight:500;font-size:13.5px}
.annrow .t-en{font-size:11.5px;color:var(--ink-3)}
.annrow .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.annrow .date{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto;flex:none}
.anndetail .body{padding:14px;font-size:13.5px;line-height:1.75;color:var(--ink-2);white-space:pre-line}
.anndetail .body .zh{color:var(--ink);display:block;margin-bottom:10px;white-space:pre-line}
.pin{color:var(--warn)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.caldow{padding:6px 8px;font-size:11px;color:var(--ink-3);text-align:center;border-bottom:1px solid var(--line);letter-spacing:.04em}
.calday{min-height:82px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;background:none;text-align:left;cursor:pointer;border-top:0;border-left:0;color:inherit}
.calday:nth-child(7n){border-right:0}
.calday:hover{background:var(--surface-2)}
.calday[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.calday.out{background:var(--surface-2);color:var(--ink-3)}
.calday .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.calday .d.today{background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 4px}
.ev{font-size:11px;border-radius:4px;padding:1px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:2px solid}
.ev.train{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.ev.audit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.ev.hr{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ev.event{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 14px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

/* ---------- org chart ---------- */
.orgwrap{overflow-x:auto;padding:18px 14px}
.orgtop{display:flex;flex-direction:column;align-items:center;gap:0}
.node{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 11px;min-width:150px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.node:hover{border-color:var(--accent);background:var(--accent-soft)}
.node .n{font-size:13px;font-weight:500}
.node .r{font-size:11px;color:var(--ink-3)}
.node.exec{background:var(--rail);color:#fff;border-color:var(--rail)}
.node.exec .r{color:var(--rail-ink-dim)}
.node.scoped{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.node.dim{opacity:.42}
.vline{width:1px;height:16px;background:var(--line-strong)}
.orgrow{display:flex;gap:12px;align-items:flex-start;justify-content:center;position:relative;padding-top:16px}
.orgrow::before{content:"";position:absolute;top:0;left:9%;right:9%;height:1px;background:var(--line-strong)}
.orgcol{display:flex;flex-direction:column;align-items:center;position:relative}
.orgcol::before{content:"";position:absolute;top:-16px;height:16px;width:1px;background:var(--line-strong)}
.orgcol .kids{display:flex;flex-direction:column;gap:5px;margin-top:14px;position:relative;width:100%}
.orgcol .kids::before{content:"";position:absolute;top:-14px;left:50%;height:14px;width:1px;background:var(--line-strong)}
.leaf{font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);text-align:left;cursor:pointer;color:var(--ink-2);font-family:inherit}
.leaf:hover{border-color:var(--accent);color:var(--ink)}

/* ---------- directory ---------- */
.dirgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));padding:14px}
.dircard{border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.dircard .n{font-weight:500}
.dircard .meta{font-size:11.5px;color:var(--ink-3)}
.dircard .rows{margin-top:6px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.dircard .rows span{display:flex;gap:6px}
.dircard .rows .lbl{color:var(--ink-3);min-width:52px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,20,18,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,94vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px -24px rgba(0,0,0,.6)}
.drawer-h{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer-b{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0}
.x{margin-left:auto;background:none;border:1px solid var(--line-strong);border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--ink-2);line-height:1;flex:none}

/* ---------- attendance ---------- */
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:3px}
.attcell{aspect-ratio:1;border-radius:3px;background:var(--ok-soft);position:relative}
.attcell.late{background:var(--warn-soft);box-shadow:inset 0 0 0 1px var(--warn-line)}
.attcell.leave{background:var(--info-soft)}
.attcell.miss{background:var(--crit-soft);box-shadow:inset 0 0 0 1px var(--crit)}
.attcell.off{background:var(--surface-2)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:76px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.low{background:var(--warn)}

/* ---------- misc ---------- */
.note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:6px;padding:9px 12px;line-height:1.6}
.note.q{border-left-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--rail);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.permtable td:first-child{white-space:normal}
.permtable td{white-space:nowrap}
.yes{color:var(--ok);font-weight:600}
.no{color:var(--ink-3)}
.partial{color:var(--warn);font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 14px}
  .brand{padding:0 14px 0 4px}
  .rail-group,.rail-foot{display:none}
  .navitem{width:auto}
  .navitem .en{display:none}
  .split{grid-template-columns:1fr}
  .content{padding:16px 14px 60px}
  .utility{padding:10px 14px}
}
</style>
<!--#artifact-split-->
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast"></div>
<script>
/* =========================================================================
   康禾長照 營運入口 — 原型 (Kanghe Long-Term Care — Operations Portal prototype)
   All data below is FICTIONAL and generated in-memory. No auth, no database.
   ========================================================================= */

/* ---------- offices (2 care homes in Hsinchu + operations HQ) ---------- */
/* v2.0 prototype: currently Hsinchu only. Future phases: Taichung (Phase 2), Changhua (Phase 3) */
const OFFICES = [
  {id:'O1', zh:'竹北照護院',  en:'Hsinchu Zhuibei',  code:'HC-01', city:{zh:'新竹縣竹北市',en:'Hsinchu Zhuibei'},  beds:64},
  {id:'O2', zh:'竹東照護院',  en:'Hsinchu Zhudong',  code:'HC-02', city:{zh:'新竹縣竹東鎮',en:'Hsinchu Zhudong'},  beds:56}
];
const HQ = {id:'HQ', zh:'新竹營運中心', en:'Hsinchu Operations Center', code:'HQ', city:{zh:'新竹縣',en:'Hsinchu'}, beds:0};
const ALL_UNITS = [HQ].concat(OFFICES);
const unit = id => ALL_UNITS.find(o=>o.id===id) || HQ;

/* ---------- v2.0: company structure (currently single entity; Phase 2–3: multi-region) ---------- */
const COMPANIES = [
  {id:'C1', zh:'康禾長照 · 新竹區', en:'Kanghe Care • Hsinchu Region', hq:'HQ', offices:['O1','O2']}
];
const companyOf = officeId => COMPANIES.find(c=>c.offices.includes(officeId));
const companyOffices = companyId => (COMPANIES.find(c=>c.id===companyId)?.offices||[]).map(id=>OFFICES.find(o=>o.id===id));

/* ---------- job titles ---------- */
const TITLES = {
  ceo:{zh:'執行長',en:'Chief Executive'},         coo:{zh:'營運長',en:'Chief Operating Officer'},
  hrd:{zh:'人資部經理',en:'HR Manager'},           fin:{zh:'財務部經理',en:'Finance Manager'},

/* v2.0: 9 roles per specification, but only 3 fully working in this prototype */
const ROLES = {

  /* --- Planned for Phase 2–3 (stubs only) --- */
  coo:{ id:'coo', zh:'營運長', en:'COO', built:false, phase:'Phase 1+' },
  finance:{ id:'finance', zh:'財務部經理', en:'Finance Manager', built:false, phase:'Phase 2' },
  nurse:{ id:'nurse', zh:'護理部主管', en:'Nursing Director', built:false, phase:'Phase 2' },
  care:{ id:'care', zh:'照護部主管', en:'Care Services Manager', built:false, phase:'Phase 2' },
  social:{ id:'social', zh:'社工室主任', en:'Social Work Supervisor', built:false, phase:'Phase 3' },
  company:{ id:'company', zh:'公司經理', en:'Company Manager', built:false, phase:'Phase 2' }
};

/* ---------- state ---------- */
const state = {
  lang:'zh', role:'admin', module:'arch', tab:'scope',
  crossOffice:false,          // ASSUMPTION TOGGLE: managers see all offices?
  office:'ALL',               // office filter within the allowed scope
  annId:'A09', calMonth:'2026-09', calDay:null,
  q:'', dirQ:'', empId:null, attMonth:'2026-08', attView:'summary', nodeId:null
};
const role = () => ROLES[state.role];
const me = () => person(role().persona);
const can = k => role().perms[k];
/* offices this role may read right now */
function scopeUnits(){
  const r = role();
  if(r.allOffices || state.crossOffice) return ALL_UNITS.map(u=>u.id);
  return [me().unit];
}
const inScope = uid => scopeUnits().includes(uid);
const scopedStaff = () => STAFF.filter(s=>inScope(s.unit));
/* offices offered in the office filter (HQ excluded from care-home filters) */
function filterUnits(){ return ALL_UNITS.filter(u=>inScope(u.id)); }
function activeUnitIds(){
  const allowed = scopeUnits();
  return state.office==='ALL' ? allowed : allowed.filter(id=>id===state.office);
}
const scopeLocked = () => !role().allOffices && !state.crossOffice;

/* ---------- i18n helpers ---------- */
const L = o => !o ? '' : (state.lang==='zh' ? o.zh : (o.en||o.zh));
const S = o => state.lang==='zh' ? (o.en||o.zh) : o.zh;      // secondary language
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* bilingual block: primary line + secondary line, always both languages */
const bi = (zh,en) => `<span class="bi"><span>${esc(state.lang==='zh'?zh:en)}</span><span class="en">${esc(state.lang==='zh'?en:zh)}</span></span>`;
const biO = o => bi(o.zh,o.en);
const both = (zh,en) => state.lang==='zh' ? `${zh} / ${en}` : `${en} / ${zh}`;
const nameOf = p => state.lang==='zh' ? p.zh : p.en;
const nameFull = p => state.lang==='zh' ? `${p.zh}` : `${p.en}`;
const money = n => 'NT$'+n.toLocaleString('en-US');

/* ---------- deterministic mock attendance ---------- */
function seed(str){ let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  h^=h>>>13; h=Math.imul(h,1540483477); h^=h>>>15;   // avalanche, so nearby ids don't correlate
  return (h>>>0)/4294967296; }
const ATT_STATUS = {
  present:{zh:'正常',en:'On time',cls:'ok'}, late:{zh:'遲到',en:'Late',cls:'warn'},
  leave:{zh:'請假',en:'On leave',cls:'info'}, miss:{zh:'未打卡',en:'Missing punch',cls:'crit'},
  off:{zh:'排休',en:'Rest day',cls:''}
};
function attendance(empId, y, m){        // m = 1-12
  const days = new Date(y, m, 0).getDate();
  const out = [];
  const last = (y===TODAY.getFullYear() && m===TODAY.getMonth()+1) ? TODAY.getDate() : days;
  for(let d=1; d<=days; d++){
    const date = new Date(y,m-1,d), dow = date.getDay();
    if(d>last){ out.push({d, status:null}); continue; }
    const r = seed(empId+'-'+y+'-'+m+'-'+d);
    let status = 'present';
    if(dow===0 || (dow===6 && r<0.7)) status='off';
    else if(r>0.985) status='miss';
    else if(r>0.945) status='leave';
    else if(r>0.900) status='late';
    const inH = status==='late' ? 8 : 7, inM = status==='late' ? 8+Math.floor(r*40) : 40+Math.floor(r*18);
    out.push({ d, dow, status,
      in: (status==='off'||status==='leave') ? null : String(inH).padStart(2,'0')+':'+String(inM%60).padStart(2,'0'),
      out:(status==='off'||status==='leave') ? null : (status==='miss' ? null : (r>0.6?'18:1':'17:3')+Math.floor(r*9)),
      ot: (status!=='off' && status!=='leave' && r>0.78) ? Math.round(r*20)/10 : 0 });
  }
  return out;
}
function attSummary(empId, y, m){
  const rows = attendance(empId,y,m).filter(r=>r.status);
  const c = {present:0,late:0,leave:0,miss:0,off:0, ot:0};
  rows.forEach(r=>{ c[r.status]++; c.ot += r.ot||0; });
  const work = c.present+c.late+c.miss;
  c.rate = work+c.leave ? Math.round(100*(work)/(work+c.leave)) : 100;
  c.punctual = work ? Math.round(100*(c.present)/work) : 100;
  return c;
}

/* =============================== 行事曆 Calendar =============================== */
function visibleEvents(){
  const units = activeUnitIds();
  return EVENTS.filter(e=>e.scope==='ALL' || units.includes(e.scope));
}
function viewCalendar(){
  const [y,m] = state.calMonth.split('-').map(Number);
  const first = new Date(y,m-1,1), start = first.getDay(), days = new Date(y,m,0).getDate();
  const prevDays = new Date(y,m-1,0).getDate();
  const evs = visibleEvents();
  const dowZh=['日','一','二','三','四','五','六'], dowEn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';
  for(let i=0;i<42;i++){
    const n=i-start+1;
    const out = n<1 || n>days;
    const dd = out ? (n<1?prevDays+n:n-days) : n;
    const dstr = out ? '' : `${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`;
    const dayEv = out?[]:evs.filter(e=>e.d===dstr);
    const isToday = dstr===ymd(TODAY);
    cells += `<button class="calday ${out?'out':''}" ${out?'disabled':''} data-day="${dstr}" aria-pressed="${dstr&&dstr===state.calDay}">
      <span class="d ${isToday?'today':''}">${dd}</span>
      ${dayEv.slice(0,3).map(e=>`<span class="ev ${e.type}">${esc(state.lang==='zh'?e.zh:e.en)}</span>`).join('')}
      ${dayEv.length>3?`<span class="ev" style="border-color:var(--line-strong);color:var(--ink-3)">+${dayEv.length-3}</span>`:''}
    </button>`;
  }
  const dayList = state.calDay ? evs.filter(e=>e.d===state.calDay) : [];
  return `
  <div class="split" style="grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)">
    <section class="card">
      <div class="calhead">
        <button class="btn ghost mini" data-mon="-1">←</button>
        <h2 class="mono">${state.calMonth}</h2>
        <span class="muted" style="font-size:12px">${esc(both('公司行事曆','Company calendar'))}</span>
        <button class="btn ghost mini" data-mon="1">→</button>
        <div class="spacer"></div>
        <span class="chip">${evs.length} ${esc(both('筆行程','events in scope'))}</span>
      </div>
      <div class="calgrid">
        ${dowZh.map((z,i)=>`<div class="caldow">${esc(state.lang==='zh'?z:dowEn[i])}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        ${Object.entries(EV_TYPE).map(([k,v])=>`<span><i class="ev ${k}" style="border:0"></i>${esc(both(v.zh,v.en))}</span>`).join('')}
      </div>
    </section>
    <section class="card">
      <div class="card-h"><h2>${state.calDay?`<span class="mono">${state.calDay}</span>`:esc(both('選取日期','Selected day'))}</h2>
        <span class="en">${esc(both('點選左方日期','Click a date'))}</span></div>
      ${dayList.length ? dayList.map(e=>`
        <div class="card-b" style="border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px">
          <div>${bi(e.zh,e.en)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span class="chip ${e.type==='audit'?'crit':e.type==='train'?'info':e.type==='hr'?'acc':'warn'}">${esc(both(EV_TYPE[e.type].zh,EV_TYPE[e.type].en))}</span>
            ${scopeChip(e.scope)}
          </div>
        </div>`).join('')
        : `<div class="empty">${esc(state.calDay?both('本日無行程','No events on this day'):both('尚未選取日期','No date selected'))}</div>`}
      <div class="legend">${esc(both('原型說明：行事曆為唯讀示意，未串接 Google 日曆或排班系統。',
        'Prototype note: the calendar is read-only — not connected to Google Calendar or the rostering system.'))}</div>
    </section>
  </div>`;
}
BINDERS['ann:cal']=function(){
  document.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{
    let [y,m]=state.calMonth.split('-').map(Number); m+=Number(b.dataset.mon);
    if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    state.calMonth=y+'-'+String(m).padStart(2,'0'); state.calDay=null; render();
  });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.day) return; state.calDay = state.calDay===b.dataset.day?null:b.dataset.day; render();
  });
};

<script>
/* =============================== 組織圖 Org chart =============================== */
function viewOrg(){
  const ceo=person('E1001'), coo=person('E1002');
  const hqStaff=STAFF.filter(s=>s.unit==='HQ' && !['E1001','E1002'].includes(s.id));
  const dirs=OFFICES.map(o=>({o, d:STAFF.find(s=>s.unit===o.id && s.title==='dir')}));
  const nodeBtn=(p,cls)=>{
    const vis=inScope(p.unit);
    return `<button class="node ${cls||''} ${vis?'':'dim'}" data-node="${p.id}">
      <span class="n">${esc(nameOf(p))}</span>
      <span class="r">${esc(both(TITLES[p.title].zh,TITLES[p.title].en))}</span></button>`;
  };
  return `
  <section class="card">
    <div class="card-h">
      <h2>${esc(both('集團組織圖','Group org chart'))}</h2>
      <span class="en">${STAFF.length} ${esc(both('人 · 7 據點 + 總部','people · 7 facilities + HQ'))}</span>
      <div class="spacer"></div>
      <span class="chip ${scopeLocked()?'warn':'acc'}">${esc(scopeLocked()
        ? both('灰階節點超出您的資料範圍','Dimmed nodes are outside your data scope')
        : both('可檢視全部節點','All nodes visible'))}</span>
    </div>
    <div class="orgwrap">
      <div class="orgtop">
        ${nodeBtn(ceo,'exec')}
        <span class="vline"></span>
        ${nodeBtn(coo,'exec')}
        <div class="orgrow" style="--n:4">
          <div class="orgcol">
            <div class="node" style="cursor:default">
              <span class="n">${esc(both('總部幕僚','HQ functions'))}</span>
              <span class="r">${esc(both('人資・財務・資訊','HR · Finance · IT'))}</span></div>
            <div class="kids">${hqStaff.map(p=>`<button class="leaf" data-node="${p.id}">${esc(nameOf(p))} · ${esc(both(TITLES[p.title].zh,TITLES[p.title].en))}</button>`).join('')}</div>
          </div>
          ${dirs.map(({o,d})=>{
            const kids=STAFF.filter(s=>s.unit===o.id && s.id!==d.id);
            const vis=inScope(o.id);
            return `<div class="orgcol">
              ${nodeBtn(d, vis&&scopeLocked()?'scoped':'')}
              <div class="kids">
                ${vis ? kids.map(p=>`<button class="leaf" data-node="${p.id}">${esc(nameOf(p))} · ${esc(both(TITLES[p.title].zh,TITLES[p.title].en))}</button>`).join('')
                      : `<span class="leaf" style="cursor:default;color:var(--ink-3)">${esc(both(kids.length+' 位同仁（不在範圍內）', kids.length+' staff (out of scope)'))}</span>`}
              </div>
              <div class="muted" style="font-size:11px;margin-top:6px">${esc(both(o.zh,o.en))}</div>
            </div>`;}).join('')}
        </div>
      </div>
    </div>
    <div class="legend">${esc(both(
      '原型假設：組織「結構」全集團可見，但個人明細（分機、到職日、薪資）依身分範圍限制。這是另一個可討論的邊界。',
      'Prototype assumption: the org structure is visible group-wide, but personal detail (extension, hire date, pay) follows role scope. This boundary is also open for discussion.'))}</div>
  </section>`;
}
BINDERS['ann:org']=function(){ document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>openPerson(b.dataset.node)); };

/* =============================== 通訊錄 Directory =============================== */
function viewDirectory(){
  const units=activeUnitIds();
  const q=state.dirQ.trim().toLowerCase();
  const list=STAFF.filter(s=>units.includes(s.unit)).filter(s=>!q ||
    (s.zh+s.en+s.ext+L(TITLES[s.title])+L(DEPTS[s.dept])+L(unit(s.unit))).toLowerCase().includes(q));
  const hidden=STAFF.length-STAFF.filter(s=>units.includes(s.unit)).length;
  return `
  <section class="card">
    <div class="card-h">
      <h2>${esc(both('內部通訊錄','Internal directory'))}</h2>
      <span class="en">${list.length} / ${STAFF.length}</span>
      <div class="spacer"></div>
      <input type="search" id="dirQ" placeholder="${esc(both('搜尋姓名、職稱、分機','Search name, title, extension'))}" value="${esc(state.dirQ)}" style="min-width:230px">
    </div>
    ${hidden>0?`<div class="note ${scopeLocked()?'q':''}" style="margin:12px 14px 0">${esc(both(
        hidden+' 位其他院區同仁未顯示（資料範圍：'+(scopeLocked()?unit(me().unit).zh:'已篩選')+'）。若主管需跨院聯絡，通訊錄是否應全集團開放？',
        hidden+' colleagues at other facilities are hidden by the current data scope. If directors need to contact peers across facilities, should the directory be group-wide?'))}</div>`:''}
    <div class="dirgrid">
      ${list.map(p=>`
        <div class="dircard">
          <span class="avatar">${esc(p.zh.slice(0,1))}</span>
          <div style="min-width:0">
            <div class="n">${esc(nameOf(p))} <span class="muted" style="font-size:11.5px">${esc(state.lang==='zh'?p.en:p.zh)}</span></div>
            <div class="meta">${esc(both(TITLES[p.title].zh,TITLES[p.title].en))} · ${esc(both(unit(p.unit).zh,unit(p.unit).en))}</div>
            <div class="rows">
              <span><span class="lbl">${esc(both('分機','Ext.'))}</span><span class="mono">${p.ext}</span></span>
              <span><span class="lbl">${esc(both('手機','Mobile'))}</span>${can('mobile')
                ? `<span class="mono">${p.mobile}</span>`
                : `<span class="lock">${lockIcon()}${esc(both('僅人資／管理員','HR & Admin only'))}</span>`}</span>
              <span><span class="lbl">${esc(both('部門','Dept.'))}</span>${esc(both(DEPTS[p.dept].zh,DEPTS[p.dept].en))}</span>
            </div>
          </div>
        </div>`).join('')}
    </div>
    ${list.length?'':`<div class="empty">${esc(both('查無符合條件的同仁','No matching colleagues'))}</div>`}
    <div class="legend">${esc(both('原型說明：手機號碼為虛構且部分遮罩，用以示意欄位級權限。',
      'Prototype note: mobile numbers are fictional and partly masked to demonstrate field-level permissions.'))}</div>
  </section>`;
}

<script>
/* =============================== 員工資料 Employee records =============================== */
function viewEmployees(){
  const units=activeUnitIds();

  <div class="grid">
    <div class="tiles">

      <div class="tile"><span class="k">${esc(both('部分工時','Part-time'))}</span><span class="v">${part}</span><span class="d">${esc(both('人','people'))}</span></div>

    <section class="card">
      <div class="card-h">
        <h2>${esc(both('員工資料','Employee records'))}</h2>
        <div class="spacer"></div>
        <input type="search" id="empQ" placeholder="${esc(both('搜尋員工編號或姓名','Search employee no. or name'))}" value="${esc(state.q)}" style="min-width:220px">
        <button class="btn mini" ${can('editEmp')?'':'disabled'} data-newemp>${esc(both('新增員工','Add employee'))}</button>
      </div>
      <div class="tablewrap">
      <table>
        <thead><tr>
          <th>${bi('員工編號','Employee no.')}</th><th>${bi('姓名','Name')}</th><th>${bi('職稱','Title')}</th>
          <th>${bi('部門','Department')}</th><th>${bi('服務據點','Facility')}</th><th>${bi('到職日','Hire date')}</th>
          <th>${bi('僱用別','Employment')}</th><th>${bi('月薪','Monthly pay')}</th>
        </tr></thead>
        <tbody>
        ${list.map(s=>`<tr class="clickable" data-emp="${s.id}">
          <td class="mono">${s.id}</td>
          <td>${esc(nameOf(s))}<span class="muted" style="font-size:11px"> ${esc(state.lang==='zh'?s.en:s.zh)}</span></td>
          <td>${esc(both(TITLES[s.title].zh,TITLES[s.title].en))}</td>
          <td>${esc(both(DEPTS[s.dept].zh,DEPTS[s.dept].en))}</td>
          <td>${esc(both(unit(s.unit).zh,unit(s.unit).en))}</td>

        <tbody>${byUnit.map(r=>`<tr>
          <td>${esc(both(unit(r.u).zh,unit(r.u).en))}</td>

      </div>

/* =============================== 請假審核 Leave approvals =============================== */
const LEAVE_STATUS={
  pending:{zh:'待主管簽核',en:'Awaiting director',cls:'warn'},
  countersign:{zh:'待人資複核',en:'Awaiting HR countersign',cls:'info'},
  approved:{zh:'已核准',en:'Approved',cls:'ok'},
  rejected:{zh:'已駁回',en:'Rejected',cls:'crit'}
};
function statusChip(s){ const o=LEAVE_STATUS[s]; return `<span class="chip ${o.cls}">${esc(both(o.zh,o.en))}</span>`; }
function viewLeave(){
  const units=activeUnitIds();
  const list=LEAVE.filter(l=>units.includes(person(l.emp).unit))
    .sort((a,b)=>({pending:0,countersign:1,approved:2,rejected:3})[a.status]-({pending:0,countersign:1,approved:2,rejected:3})[b.status] || a.from.localeCompare(b.from));
  const pend=list.filter(l=>l.status==='pending').length, cs=list.filter(l=>l.status==='countersign').length;
  const rowAction=l=>{
    if(l.status==='pending' && can('approve'))
      return `<button class="btn mini" data-act="approve" data-id="${l.id}">${esc(both('核准','Approve'))}</button>
              <button class="btn ghost mini" data-act="reject" data-id="${l.id}">${esc(both('駁回','Reject'))}</button>`;
    if(l.status==='countersign' && can('finalize'))
      return `<button class="btn mini" data-act="final" data-id="${l.id}">${esc(both('人資複核','Countersign'))}</button>`;
    if(l.status==='countersign' && !can('finalize'))
      return `<span class="lock">${lockIcon()}${esc(both('待人資處理','With HR'))}</span>`;
    if(l.status==='pending' && !can('approve'))
      return `<span class="lock">${lockIcon()}${esc(both('無簽核權限','No approval rights'))}</span>`;
    return `<span class="muted">—</span>`;
  };
  return `
  <div class="grid">
    <div class="tiles">
      <div class="tile"><span class="k">${esc(both('待主管簽核','Awaiting director'))}</span><span class="v">${pend}</span><span class="d">${esc(both('件','requests'))}</span></div>
      <div class="tile"><span class="k">${esc(both('待人資複核','Awaiting HR'))}</span><span class="v">${cs}</span><span class="d">${esc(both('件','requests'))}</span></div>
      <div class="tile"><span class="k">${esc(both('範圍內申請總數','Requests in scope'))}</span><span class="v">${list.length}</span><span class="d">${esc(both('全集團 '+LEAVE.length+' 件','of '+LEAVE.length+' group-wide'))}</span></div>
    </div>
    <div class="note q">${esc(both(
      '待決議題（流程）：院長核准後，是否仍需人資複核才生效？本原型預設「需要」— 院長核准 → 待人資複核 → 生效。',
      'Open question (workflow): after a director approves, must HR countersign before the leave takes effect? The prototype assumes YES — director approves → HR countersigns → effective.'))}</div>
    <section class="card">
      <div class="card-h"><h2>${esc(both('請假申請','Leave requests'))}</h2>
        <span class="en">${esc(both('操作僅存於本次瀏覽','Actions persist for this browser session only'))}</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th>${bi('單號','Request')}</th><th>${bi('申請人','Employee')}</th><th>${bi('據點','Facility')}</th>
          <th>${bi('假別','Leave type')}</th><th>${bi('起訖','Dates')}</th><th>${bi('天數','Days')}</th>
          <th>${bi('狀態','Status')}</th><th>${bi('備註','Note')}</th><th>${bi('簽核','Action')}</th></tr></thead>
        <tbody>${list.map(l=>{const p=person(l.emp);return `<tr>
          <td class="mono">${l.id}</td>
          <td>${esc(nameOf(p))}</td>
          <td>${esc(both(unit(p.unit).zh,unit(p.unit).en))}</td>
          <td>${esc(both(LEAVE_TYPES[l.type].zh,LEAVE_TYPES[l.type].en))}</td>
          <td class="mono">${l.from}${l.to!==l.from?' → '+l.to:''}</td>
          <td class="num">${l.days}</td>
          <td>${statusChip(l.status)}</td>
          <td class="muted" style="white-space:normal;max-width:200px">${esc(L(l.note)||'—')}</td>
          <td style="display:flex;gap:6px">${rowAction(l)}</td>
        </tr>`;}).join('')}</tbody></table></div>
      ${list.length?'':`<div class="empty">${esc(both('目前資料範圍內沒有請假申請','No leave requests in the current data scope'))}</div>`}
      <div class="legend">${esc(both(
        '原型說明：簽核不會寄送通知、不寫入資料庫、也未計算特休餘額；重新整理即還原。',
        'Prototype note: approvals send no notifications, write to no database, and do not compute leave balances; reload resets them.'))}</div>
    </section>
  </div>`;
}
BINDERS['hr:leave']=function(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const l=LEAVE.find(x=>x.id===b.dataset.id); if(!l) return;
    const p=person(l.emp);
    if(b.dataset.act==='approve'){ l.status='countersign';
      toast(both(l.id+'：'+nameOf(p)+' 已核准，轉人資複核', l.id+': approved for '+nameOf(p)+', sent to HR for countersign')); }
    if(b.dataset.act==='reject'){ l.status='rejected';
      toast(both(l.id+'：已駁回', l.id+': rejected')); }
    if(b.dataset.act==='final'){ l.status='approved';
      toast(both(l.id+'：人資複核完成，假單生效', l.id+': countersigned by HR — leave is effective')); }
    render();
  });
};

            <div>${esc(state.lang==='zh'?q.askZh:q.askEn)}</div>
            <div class="muted" style="font-size:12px">${esc(state.lang==='zh'?q.askEn:q.askZh)}</div></div>
        </div>
      </section>`).join('')}
    <section class="card">
      <div class="card-h"><h2>${esc(both('本原型建置範圍','Scope of this prototype'))}</h2></div>
      <div class="tablewrap"><table>
        <thead><tr><th>${bi('項目','Item')}</th><th>${bi('狀態','Status')}</th><th>${bi('說明','Detail')}</th></tr></thead>
        <tbody>
          <tr><td>${bi('公告欄','Announcements')}</td><td><span class="chip ok">${esc(both('已建置','Built'))}</span></td>
            <td style="white-space:normal">${esc(both('公告列表與內文、公司行事曆、組織圖、內部通訊錄，皆套用身分範圍。','Board and detail, company calendar, org chart and internal directory — all scoped by role.'))}</td></tr>
          <tr><td>${bi('人事系統','HR core')}</td><td><span class="chip ok">${esc(both('已建置','Built'))}</span></td>
            <td style="white-space:normal">${esc(both('員工資料、出勤統計與個人出勤圖、請假簽核流程。','Employee records, attendance statistics with per-person month patterns, and the leave approval workflow.'))}</td></tr>
          <tr><td>${bi('其他 5 個模組','Other 5 modules')}</td><td><span class="chip">${esc(both('未建置','Not built'))}</span></td>
            <td style="white-space:normal">${esc(both('文件管理、服務管理、財務與採購、報表匯出、系統設定 — 左側選單以停用狀態呈現，僅示意整體架構。','Document Control, Service Management, Finance & Procurement, Reports Export, Settings — shown disabled in the left rail to convey the whole system shape.'))}</td></tr>
          <tr><td>${bi('登入與帳號','Login & accounts')}</td><td><span class="chip warn">${esc(both('模擬','Mocked'))}</span></td>
            <td style="white-space:normal">${esc(both('沒有真實驗證，身分以上方下拉選單切換。','No real authentication — role is switched from the dropdown above.'))}</td></tr>
          <tr><td>${bi('資料儲存','Data storage')}</td><td><span class="chip warn">${esc(both('模擬','Mocked'))}</span></td>
            <td style="white-space:normal">${esc(both('全部資料存在瀏覽器記憶體，重新整理即還原；無資料庫、無後端。','All data lives in browser memory and resets on reload — no database, no backend.'))}</td></tr>
          <tr><td>${bi('人員與院區','People & facilities')}</td><td><span class="chip warn">${esc(both('虛構','Fictional'))}</span></td>
            <td style="white-space:normal">${esc(both('47 位同仁、7 個院區與總部皆為虛構，不含任何真實個資。','47 staff, 7 facilities and an HQ — all fictional, containing no real personal data.'))}</td></tr>
        </tbody></table></div>
    </section>
  </div>`;
}
